[project]
name = "confidential-model-delivery-poc"
version = "0.1.0"
description = "Proof of concept for confidential AI model delivery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46.0.0,<47",
    "huggingface-hub>=1.0.0,<2",
    "sentence-transformers>=5.0.0,<6",
]

[project.scripts]
confidential-model-delivery-poc = "confidential_model_delivery_poc:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10",
]
