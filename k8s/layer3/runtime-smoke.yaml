# Runtime-only smoke: no model, keys, attestation request or KBS dependency.
# Use create, not apply: generateName preserves evidence from previous runs.
apiVersion: v1
kind: Pod
metadata:
  generateName: kata-runtime-smoke-
  namespace: secure-ai-layer3
  labels:
    app: kata-runtime-smoke
  annotations:
    io.containerd.cri.runtime-handler: kata-qemu-coco-dev
spec:
  runtimeClassName: kata-qemu-coco-dev
  restartPolicy: Never
  automountServiceAccountToken: false
  activeDeadlineSeconds: 300
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
  containers:
    - name: smoke
      image: docker.io/library/busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-ec"]
      args:
        - |
          uname -r
          test "$(id -u)" -eq 10001
          echo kata_smoke_ok=true
      resources:
        requests:
          cpu: 100m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
