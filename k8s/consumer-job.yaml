apiVersion: batch/v1
kind: Job
metadata:
  name: model-consumer
  namespace: secure-ai-poc
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: consumer
          image: cmdp-consumer:0.1.0
          imagePullPolicy: Never
          args:
            - --repo-id
            - $(BUNDLE_REPOSITORY)
            - --revision
            - $(BUNDLE_REVISION)
            - --key-file
            - /var/run/secrets/model-delivery/key
            - --work-dir
            - /work
          envFrom:
            - configMapRef:
                name: model-bundle-source
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: model-key
              mountPath: /var/run/secrets/model-delivery
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: model-key
          secret:
            secretName: model-decryption-key
        - name: work
          emptyDir:
            sizeLimit: 1Gi
